name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish (for example v1.0.1); leave empty to build artifacts only
        required: false
        type: string
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows packages
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install frontend and backend dependencies
        shell: pwsh
        run: |
          npm ci
          uv venv .venv --python 3.12
          uv pip install --python .venv\Scripts\python.exe -r backend\requirements.txt

      - name: Build installer and portable package
        shell: pwsh
        run: npm run electron:packages

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoviePop-Windows-Installer
          path: build/*-nsis.exe
          if-no-files-found: error

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoviePop-Windows-Portable
          path: build/*-portable.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            build/*-nsis.exe
            build/*-portable.exe
